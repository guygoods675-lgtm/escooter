# Builds an installable Android APK on GitHub's servers.
# Push this project to a GitHub repo, open the Actions tab, run "Android APK",
# then download the "ScooterHub-apk" artifact (ScooterHub.apk) from the finished run.
name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      # android/ is committed; this re-syncs it with app.json (icons, permissions, plugins).
      - name: Sync native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        # The Expo template signs release builds with the debug keystore, which is
        # fine for sideloading. Use EAS or your own keystore for Play Store uploads.
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../ScooterHub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScooterHub-apk
          path: ScooterHub.apk

      # When you push a tag like v3.0.0, the APK is also attached to a GitHub Release.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ScooterHub.apk
